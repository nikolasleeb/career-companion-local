name: career-companion-local
services:
  app:
    image: ${CAREER_IMAGE:-ghcr.io/nikolasleeb/career-companion-local:1.0.9}
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/static
      VAULT_KEY_FILE: /secrets/vault.key
      CAREER_ENV: local
      ONET_API_KEY: ${ONET_API_KEY:-}
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      ENABLE_JOBSPY: "false"
      USAJOBS_API_KEY: ${USAJOBS_API_KEY:-}
      USAJOBS_API_EMAIL: ${USAJOBS_API_EMAIL:-}
      CF_EMAIL_TOKEN: ${CF_EMAIL_TOKEN:-}
      CF_EMAIL_ACCOUNT_ID: ${CF_EMAIL_ACCOUNT_ID:-}
      ALERT_FROM: ${ALERT_FROM:-}
      ALERT_PUBLIC_ORIGIN: ${ALERT_PUBLIC_ORIGIN:-http://localhost:3000}
    volumes:
      - account_data:/data
      - private_vault_key:/secrets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 160
    mem_limit: 3g
    cpus: 3.0
    restart: unless-stopped
volumes:
  account_data:
  private_vault_key:
