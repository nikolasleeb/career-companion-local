name: career-companion-local
services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/static
      VAULT_KEY_FILE: /secrets/vault.key
      CAREER_ENV: local
      ONET_API_KEY: ${ONET_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      ENABLE_JOBSPY: "false"
    volumes:
      - account_data:/data
      - private_vault_key:/secrets
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 160
    mem_limit: 3g
    cpus: 3.0
    restart: unless-stopped
volumes:
  account_data:
  private_vault_key:
