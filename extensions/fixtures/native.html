<!doctype html><html><head><meta charset="utf-8"><title>Fictional Application Fixture</title><style>body{font:16px system-ui;max-width:800px;margin:30px auto;padding:20px}label{display:block;margin:14px 0}input,select,textarea{font:inherit;padding:6px}fieldset{margin:16px 0}button{padding:10px;margin:10px}</style></head><body><h1>Fictional application — no submission</h1><form onsubmit="event.preventDefault();document.getElementById('events').textContent='Attempted submission blocked by fixture'">
<label>Full name <input id="name" autocomplete="name"></label><label>Email <input id="email" type="email" autocomplete="email"></label><label>Phone number <input id="phone" type="tel" autocomplete="tel"></label><label>City <input id="city" value="My manual city"></label><label>Country <select id="country"><option value="">Choose</option><option value="US">United States</option><option value="CA">Canada</option></select></label>
<fieldset role="radiogroup"><legend>Are you a veteran?</legend><label><input type="radio" name="veteran" value="yes">Yes</label><label><input type="radio" name="veteran" value="no">No</label><label><input type="radio" name="veteran" value="skip">Prefer not to answer</label></fieldset>
<label><input id="updates" type="checkbox">Send me recruiting updates</label><label>Why this role?<textarea id="why"></textarea></label><label>Choose a city<input id="combo" role="combobox" aria-controls="cities" readonly></label><div id="cities" role="listbox"><div role="option" tabindex="0" onclick="document.getElementById('combo').value=this.textContent">Phoenix</div><div role="option" tabindex="0" onclick="document.getElementById('combo').value=this.textContent">Tucson</div></div><label>Resume upload <input id="upload" type="file" accept=".pdf"></label><button type="button" onclick="location.href='page2.html'">Next</button><output id="events"></output></form></body></html>
