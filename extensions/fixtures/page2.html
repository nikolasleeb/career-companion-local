<!doctype html><html><head><meta charset="utf-8"><title>Fictional Education Fixture</title></head><body><h1>Education and employment</h1><form onsubmit="event.preventDefault()"><fieldset data-repeat-section="education"><legend>Education 1</legend><label>School name<input id="school0"></label><label>Degree<input id="degree0"></label></fieldset><fieldset data-repeat-section="education"><legend>Education 2</legend><label>School name<input id="school1"></label><label>Degree<input id="degree1"></label></fieldset><fieldset data-repeat-section="employment"><legend>Employment 1</legend><label>Employer<input id="employer0"></label><label>Job title<input id="title0"></label></fieldset><button type="button" id="dynamic">Add another education entry</button><div id="extra"></div><button type="button" onclick="sessionStorage.setItem('cc-fixture-repeat',JSON.stringify(Array.from(document.querySelectorAll('fieldset')).map(f=>({section:f.querySelector('legend').textContent,values:Array.from(f.querySelectorAll('input')).map(i=>i.value)}))));location.href='review.html'">Save and continue</button></form><script>document.getElementById('dynamic').onclick=()=>{document.getElementById('extra').innerHTML='<fieldset data-repeat-section="education"><legend>Education 3</legend><label>School name<input id="school2"></label></fieldset>';};</script></body></html>
